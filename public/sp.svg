<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="redToBlueGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF0000;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0000FF;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <style>
    .clean-rounded-text {
      /* 1. 폰트: 시스템 둥근 폰트들 */
      font-family: 'Quicksand', 'Ubuntu', 'Noto Sans', sans-serif;
      font-weight: bold;
      font-size: 130px;
      
      /* 2. 중앙 정렬 */
      text-anchor: middle;
      dominant-baseline: central;
      
      /* 3. 색상 - 그라데이션 적용 */
      fill: url(#redToBlueGradient);
      
      /* 4. 테두리 설정: 뚱뚱하지 않게, 모서리만 살짝 다듬기 */
      stroke: url(#redToBlueGradient);
      
      /* 너무 두꺼우면 둔해보이고, 너무 얇으면 뾰족해 보립니다. 
         3.5px이 가장 깔끔한 타협점입니다. */
      stroke-width: 8px; 
      
      /* 모서리와 끝을 둥글게 */
      stroke-linejoin: round;
      stroke-linecap: round;
      
      /* 테두리가 글자 안쪽을 침범하지 않게 뒤로 보냄 */
      paint-order: stroke fill;
    }
  </style>
  
  <!-- 흰색 배경 라운드 정사각형 -->
  <rect x="0" y="0" width="200" height="200" rx="40" ry="40" fill="white" />
  
  <text x="100" y="100" class="clean-rounded-text">SP</text>
</svg>